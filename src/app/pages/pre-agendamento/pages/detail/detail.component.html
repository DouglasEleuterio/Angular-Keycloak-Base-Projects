<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <h5>{{ 'title.detail' | appTranslate:'pre_agendamento' }}</h5>
      </div>
      <app-calendar-root
        #calendar
        (pageLoaded)="handlePageLoaded()"
        (eventClick)="handleEventClick($event)"
        (eventChange)="handleEventChange($event)"
      ></app-calendar-root>
      <div class="card flex justify-content-center">
        <p-button (click)="showDialog()" icon="pi pi-external-link" label="Show"></p-button>
      </div>
    </div>
  </div>
</div>

<p-dialog
  header="Alterar Agendamento?"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [position]="'top'"
  [resizable]="false"
>
  <p class="m-0">{{titulo}}</p>
</p-dialog>
