<div class="demo-app">
  <div class="demo-app-sidebar">
    <div class="demo-app-sidebar-section">
      <h2>Agendamentos ({{currentEvents.length}})</h2>
      <ul>
        <li *ngFor="let event of currentEvents">
          <b>{{event.startStr | date: 'dd/MM/yyyy hh:mm'}}</b>
          <br><i>{{event.extendedProps.procedimento}} - {{event.extendedProps.regiao}}</i>
          <br><i>{{event.extendedProps.paciente}} - {{event.extendedProps.whatsapp}}</i>
        </li>
      </ul>
    </div>
  </div>

  <div class="demo-app-main">
    <full-calendar *ngIf="calendarVisible" [options]="calendarOptions">
      <ng-template #eventContent let-arg>
        <b>{{ arg.timeText }}</b>
        <i>{{ arg.event.title }}</i>
      </ng-template>
    </full-calendar>
  </div>
</div>
